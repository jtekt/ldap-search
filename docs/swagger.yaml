basePath: /
definitions:
  config.Config:
    properties:
      endpoints:
        description: Endpoint configurations
        items:
          $ref: '#/definitions/config.EndpointConfig'
        type: array
      jwks_uri:
        description: OIDC Configuration
        type: string
      ldap_hostname:
        description: LDAP Configuration
        type: string
      ldap_port:
        type: string
      ldap_search_ou:
        type: string
      port:
        type: string
    type: object
  config.EndpointConfig:
    properties:
      attributes:
        description: Attributes to return
        items:
          type: string
        type: array
      filter:
        description: Base LDAP filter
        type: string
      path:
        description: e.g., "/api/v1/groups"
        type: string
      search_params:
        description: Allowed search attributes
        items:
          type: string
        type: array
    type: object
info:
  contact:
    email: kevin_fabel@jtekt.co.jp
    name: Support Team
  description: This API provides endpoints to search an LDAP directory based on configurable
    filters and attributes. It supports dynamic endpoints defined in the configuration,
    allowing searches by path parameters (e.g., /api/{id}) and query parameters (e.g.,
    ?search=value). All endpoints except / and /health require Bearer token authentication
    via the Authorization header.
  title: LDAP Search API
  version: "1.0"
paths:
  /:
    get:
      consumes:
      - application/json
      description: Returns the application configuration, including endpoint details,
        excluding sensitive LDAP connection data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/config.Config'
      summary: Get application metadata
      tags:
      - metadata
  /health:
    get:
      consumes:
      - application/json
      description: Returns a simple status to indicate the application is running
      produces:
      - application/json
      responses:
        "200":
          description: 'Example response: {\"status\": \"ok\"}'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
swagger: "2.0"
